# .github/workflows/dependabot-label.yml
name: Dependabot Auto Label

on: pull_request

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot 메타데이터 가져오기
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: 직접 의존성 라벨 추가
        if: steps.metadata.outputs.dependency-type == 'direct:production'
        run: |
          gh label create "dependencies" --color "0052cc" --description "Dependency update" --force
          gh label create "security"     --color "e4e669" --description "Security update" --force
          gh pr edit "$PR_URL" --add-label "dependencies,security"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: major 업데이트 라벨 추가
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh label create "major-update" --color "d93f0b" --description "Major version update - manual review required" --force
          gh pr edit "$PR_URL" --add-label "major-update"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}