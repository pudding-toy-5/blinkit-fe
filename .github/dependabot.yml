version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly" # 매주 체크 (daily, monthly 변경 가능)
    open-pull-requests-limit: 5 # 동시에 열어둘 최대 PR 개수
    labels:
      - "dependencies" # PR에 자동으로 붙을 라벨 지정

  # GitHub Actions 라이브러리 자동 PR 설정 (선택 사항)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
