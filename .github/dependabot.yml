version: 2
updates:
  - package-ecosystem: "npm" # 사용하는 패키지 매니저로 변경 (예: maven, gradle 등)
    directory: "/"
    schedule:
      interval: "weekly"      # 매주(weekly) 실행으로 설정
      time: "09:00"          # 오전 9시에 실행
      timezone: "Asia/Seoul"

    # 💡 핵심: 여러 업데이트를 하나의 PR로 묶기
    groups:
      dependencies-group:
        patterns:
          - "*"              # 모든 라이브러리 업데이트를 하나의 PR로 묶음